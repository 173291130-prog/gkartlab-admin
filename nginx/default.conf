# Copy this file to the host machine, for example:
# /etc/nginx/conf.d/ai-painting-admin.conf
#
# Replace admin.example.com with your real domain, then reload host Nginx.

server {
  listen 80;
  server_name admin.example.com;

  client_max_body_size 50m;

  location ^~ /api/files/uploads/ {
    alias /opt/gkartlab-admin/storage/uploads/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff";
  }

  location ^~ /api/files/generated/ {
    alias /opt/gkartlab-admin/storage/generated/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff";
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
  }
}
